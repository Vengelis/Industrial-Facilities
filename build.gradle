plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

// Keep the last successful package version outside build/ so clean preserves it.
def versionFile = layout.projectDirectory.file('version.properties')
def savedVersion = new Properties()
savedVersion.load(new StringReader(providers.fileContents(versionFile).asText
        .orElse('version=1.1.0\n').get()))
def lastVersion = savedVersion.getProperty('version')
if (lastVersion == null || !(lastVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException('version.properties must contain version=major.minor.patch')
}

// IDE syncs, help, tests and runClient do not consume a version number.
def packagingTasks = ['build', 'buildNeeded', 'buildDependents', 'assemble', 'jar']
def requestedPackagingTasks = gradle.startParameter.taskNames
        .collect { it.tokenize(':').last() }
        .findAll { packagingTasks.contains(it) }
def parts = lastVersion.tokenize('.')
def buildVersion = requestedPackagingTasks.isEmpty() ? lastVersion :
        "${parts[0]}.${parts[1]}.${new BigInteger(parts[2]) + BigInteger.ONE}".toString()
version = buildVersion

// Commit the version only when the requested packaging task succeeds.
tasks.matching { requestedPackagingTasks.contains(it.name) }.configureEach {
    doLast {
        versionFile.asFile.setText("version=${buildVersion}\n", 'UTF-8')
    }
}

// MCreator writes a fixed source version; replace it in the packaged resources.
tasks.named('processResources') {
    inputs.property('modVersion', buildVersion)
    filesMatching('META-INF/neoforge.mods.toml') {
        filter { String line ->
            line.replaceFirst(/^version\s*=.*$/, "version=\"${buildVersion}\"")
        }
    }
}
base.archivesName = "IndustrialFacilities"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "21.1.232"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

apply from: 'mcreator.gradle'
